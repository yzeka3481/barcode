<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Code Scanner | Premium</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <img src="logo.png" alt="Logo" style="width: 64px; height: 64px; margin-bottom: 12px; border-radius: 16px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);">
      <h1>Code Scanner</h1>
      <p>Yapay zeka destekli seri numara tarayıcı</p>
    </header>

    <main class="glass-card">
      <div style="display: flex; gap: 12px; margin-bottom: 16px;">
        <div class="status-pill" id="autoState">
          <i data-lucide="scan-line" style="width: 14px; margin-right: 6px;"></i>
          Tarama aktif
        </div>
        <label class="toggle-container" style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--primary); cursor: pointer;">
          <input type="checkbox" id="autoSaveToggle" checked style="width: 16px; height: 16px; accent-color: var(--primary);">
          Otomatik Kaydet
        </label>
      </div>

      <div class="scanner-container" id="cameraShell">
        <video id="video" autoplay playsinline muted></video>
        <div class="scanner-overlay">
          <div class="scan-region">
            <div class="scan-line"></div>
          </div>
          <div id="matchBox" style="position: absolute; border: 2px solid var(--warning); display: none; pointer-events: none;"></div>
        </div>
      </div>

      <div class="result-box">
        <div class="result-label">Okunan Metin (Düzenlenebilir)</div>
        <input type="text" class="result-value" id="resultBox" value="Tarama bekleniyor..." style="width: 100%; background: transparent; border: none; outline: none; padding: 0;">
      </div>

      <div class="input-group" style="margin-top: 24px;">
        <label for="referenceInput">Referans Metni</label>
        <input id="referenceInput" class="input-field" value="Service Tag:" placeholder="Örn: Service Tag:" />
      </div>

      <div class="input-group hidden">
        <label for="manualInput">Bulunan Seri No</label>
        <input id="manualInput" class="input-field" placeholder="Otomatik dolacak..." />
      </div>

      <div class="button-grid">
        <button class="btn btn-primary" id="saveBtn">
          <i data-lucide="plus-circle" style="width: 18px;"></i>
          Listeye Ekle
        </button>
        <button class="btn btn-secondary" id="exportBtn">
          <i data-lucide="download" style="width: 18px;"></i>
          XLS Aktar
        </button>
      </div>

      <div class="button-grid" style="margin-top: 12px;">
        <button class="btn btn-danger" id="clearBtn">
          <i data-lucide="trash-2" style="width: 18px;"></i>
          Temizle
        </button>
        <button class="btn btn-secondary" id="restartBtn">
          <i data-lucide="refresh-cw" style="width: 18px;"></i>
          Yenile
        </button>
      </div>

      <div id="statusBox" style="font-size: 13px; color: var(--text-muted); margin-top: 16px; text-align: center;">
        Kamera hazırlanıyor...
      </div>
      
      <div id="debugBox" class="hidden"></div>
      
      <canvas id="frameCanvas" class="hidden"></canvas>
      <canvas id="cropCanvas" class="hidden"></canvas>
      
      <div style="margin-top: 20px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border);">
        <img id="preview" alt="Önizleme" style="width: 100%; display: block; filter: grayscale(1) contrast(1.2);" />
      </div>
    </main>

    <section class="glass-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; flex-direction: column;">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Kayıtlar</h2>
          <span id="recordCount" style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">0 Kayıt</span>
        </div>
        <button class="btn btn-secondary" id="copyAllBtn" style="padding: 8px 16px; font-size: 13px;">
          <i data-lucide="copy" style="width: 14px; margin-right: 6px;"></i>
          Tümünü Kopyala
        </button>
      </div>
      
      <div style="overflow-x: auto;">
        <table class="records-table" id="recordsTable">
          <thead>
            <tr>
              <th style="width: 50px;">#</th>
              <th>Seri Numarası</th>
              <th style="width: 60px; text-align: right;">İşlem</th>
            </tr>
          </thead>
          <tbody>
            <!-- Dinamik dolacak -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    // Lucide ikonlarını yükle
    lucide.createIcons();

    const video = document.getElementById('video');
    const frameCanvas = document.getElementById('frameCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const preview = document.getElementById('preview');
    const resultBox = document.getElementById('resultBox');
    const statusBox = document.getElementById('statusBox');
    const debugBox = document.getElementById('debugBox');
    const manualInput = document.getElementById('manualInput');
    const referenceInput = document.getElementById('referenceInput');
    const recordsTableBody = document.querySelector('#recordsTable tbody');
    const cameraShell = document.getElementById('cameraShell');
    const matchBox = document.getElementById('matchBox');
    const autoSaveToggle = document.getElementById('autoSaveToggle');
    const recordCountEl = document.getElementById('recordCount');

    let audioCtx = null;
    function playBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(50);
    }

    let stream = null;
    let autoTimer = null;
    let ocrBusy = false;
    let lastAcceptedSerial = '';
    let lastAcceptedAt = 0;
    let records = JSON.parse(localStorage.getItem('serial_records_premium_v1') || '[]');

    function setStatus(msg) { statusBox.textContent = msg; }
    function setResult(msg) { 
      resultBox.value = msg; 
      if (msg !== 'Tarama bekleniyor...') {
        resultBox.style.color = 'var(--primary)';
      }
    }

    function normalizeText(s) {
      return String(s || '')
        .toUpperCase()
        .replace(/[|]/g, 'I')
        .replace(/[“”‘’]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeRegex(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function buildLooseReferenceRegex(refText) {
      const chars = normalizeText(refText).replace(/\s+/g, '');
      const parts = chars.split('').map(ch => escapeRegex(ch));
      return new RegExp(parts.join('\\s*'));
    }

    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        setStatus('Kamera hazırlanıyor...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        setStatus('Tarama için hazır.');
        startAutoReading();
      } catch (err) {
        setStatus('Kamera hatası: ' + err.message);
      }
    }

    function captureCurrentFrame() {
      if (!video.srcObject || !video.videoWidth || !video.videoHeight) return null;
      frameCanvas.width = video.videoWidth;
      frameCanvas.height = video.videoHeight;
      frameCanvas.getContext('2d').drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
      return frameCanvas;
    }

    function enhanceForOCR(canvas) {
      const ctx = canvas.getContext('2d');
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        let gray = 0.299 * r + 0.587 * g + 0.114 * b;
        gray = gray > 145 ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = gray;
      }
      ctx.putImageData(img, 0, 0);
    }

    function mapSourceToOverlayRect(srcX, srcY, srcW, srcH, sourceCanvas) {
      const shellW = cameraShell.clientWidth;
      const shellH = cameraShell.clientHeight;
      const scale = Math.max(shellW / sourceCanvas.width, shellH / sourceCanvas.height);
      const displayedW = sourceCanvas.width * scale;
      const displayedH = sourceCanvas.height * scale;
      const offsetX = (shellW - displayedW) / 2;
      const offsetY = (shellH - displayedH) / 2;

      return {
        x: offsetX + srcX * scale,
        y: offsetY + srcY * scale,
        w: srcW * scale,
        h: srcH * scale
      };
    }

    function drawMatchBox(rect) {
      matchBox.style.display = 'block';
      matchBox.style.left = rect.x + 'px';
      matchBox.style.top = rect.y + 'px';
      matchBox.style.width = rect.w + 'px';
      matchBox.style.height = rect.h + 'px';
    }

    function extractSerialNearReference(text, referenceText) {
      const cleaned = normalizeText(text);
      const refRegex = buildLooseReferenceRegex(referenceText);
      const refMatch = cleaned.match(refRegex);

      if (!refMatch) return { serial: '', reason: 'Referans bulunamadı.' };

      // Referansın hemen sonrasındaki kısmı al
      const after = cleaned.slice(refMatch.index + refMatch[0].length).trim();
      
      // Daha geniş bir arama: Harf, rakam, tire ve boşlukları içeren ilk bloğu al (4-32 karakter)
      // Bu sayede boşluklu veya daha uzun "cümleleri" yakalayabiliriz.
      const multiWordRegex = /^[A-Z0-9\-\s]{3,32}/;
      const m = after.match(multiWordRegex);
      
      if (m && m[0].trim().length >= 3) {
        return { serial: m[0].trim(), reason: 'Bulundu.' };
      }

      // Alternatif: Eğer yukarıdaki yemezse, yakınlardaki herhangi bir seri no formatını ara
      const genericRegex = /[A-Z0-9\-]{4,}/;
      const anyMatch = after.slice(0, 48).match(genericRegex);
      if (anyMatch && anyMatch[0]) return { serial: anyMatch[0], reason: 'Yakın alandan bulundu.' };

      return { serial: '', reason: 'Seri no tespit edilemedi.' };
    }

    async function runLiveRead() {
      if (ocrBusy || document.activeElement === resultBox) return;

      const referenceText = normalizeText(referenceInput.value);
      if (!referenceText) {
        setStatus('Referans metni eksik.');
        return;
      }

      const source = captureCurrentFrame();
      if (!source) return;

      ocrBusy = true;
      try {
        setStatus('Tarama yapılıyor...');
        const sourceDataUrl = source.toDataURL('image/jpeg', 0.8);
        const result = await Tesseract.recognize(sourceDataUrl, 'eng');
        const rawText = normalizeText(result?.data?.text || '');
        const words = result?.data?.words || [];
        const refRegex = buildLooseReferenceRegex(referenceText);
        const parsed = extractSerialNearReference(rawText, referenceText);

        let matchedWordIndices = [];
        for (let i = 0; i < words.length; i++) {
          const w = normalizeText(words[i].text || '');
          if (!w) continue;
          if (refRegex.test(w.replace(/\s+/g, ''))) matchedWordIndices.push(i);
        }

        if (!matchedWordIndices.length) {
          for (let i = 0; i < words.length - 1; i++) {
            const combo = normalizeText((words[i].text || '') + (words[i + 1].text || ''));
            if (combo && refRegex.test(combo.replace(/\s+/g, ''))) {
              matchedWordIndices = [i, i + 1];
              break;
            }
          }
        }

        if (matchedWordIndices.length) {
          const boxes = matchedWordIndices.map(i => words[i].bbox || words[i].box || null).filter(Boolean);
          if (boxes.length) {
            const left = Math.min(...boxes.map(b => b.x0 ?? b.left ?? 0));
            const top = Math.min(...boxes.map(b => b.y0 ?? b.top ?? 0));
            const right = Math.max(...boxes.map(b => b.x1 ?? b.right ?? 0));
            const bottom = Math.max(...boxes.map(b => b.y1 ?? b.bottom ?? 0));

            const padX = Math.max(90, Math.round((right - left) * 4.5));
            const padY = Math.max(28, Math.round((bottom - top) * 1.7));

            const cropX = Math.max(0, left);
            const cropY = Math.max(0, top - padY);
            const cropW = Math.min(source.width - cropX, (right - left) + padX);
            const cropH = Math.min(source.height - cropY, (bottom - top) + padY * 2);

            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            cropCanvas.getContext('2d').drawImage(source, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            enhanceForOCR(cropCanvas);
            preview.src = cropCanvas.toDataURL('image/jpeg', 0.92);

            const rect = mapSourceToOverlayRect(cropX, cropY, cropW, cropH, source);
            drawMatchBox(rect);
          }
        } else {
          matchBox.style.display = 'none';
        }

        if (parsed.serial) {
          const now = Date.now();
          const repeated = parsed.serial === lastAcceptedSerial && (now - lastAcceptedAt < 3000);
          manualInput.value = parsed.serial;
          setResult(parsed.serial);

          if (!repeated) {
            lastAcceptedSerial = parsed.serial;
            lastAcceptedAt = now;
            setStatus('Seri no başarıyla okundu.');
            
            // Başarı geri bildirimi
            resultBox.style.animation = 'pulse 0.5s ease-in-out';
            setTimeout(() => resultBox.style.animation = '', 500);

            // Otomatik Kaydet açıksa ve listede yoksa ekle
            if (autoSaveToggle.checked && !records.includes(parsed.serial)) {
              addRecord(parsed.serial);
              playBeep();
              triggerHaptic();
            }
          } else {
            setStatus('Aynı seri no taranıyor...');
          }
        } else {
          setStatus(parsed.reason);
        }
      } catch (err) {
        setStatus('Hata: ' + err.message);
      } finally {
        ocrBusy = false;
      }
    }

    function startAutoReading() {
      if (autoTimer) clearInterval(autoTimer);
      runLiveRead();
      autoTimer = setInterval(runLiveRead, 2500);
    }

    function renderTable() {
      recordsTableBody.innerHTML = '';
      records.forEach((serial, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td style="font-weight: 600; color: var(--text-main);">${escapeHtml(serial)}</td>
          <td style="text-align: right; display: flex; gap: 8px; justify-content: flex-end;">
            <button class="mini-delete" onclick="copyRecord('${escapeHtml(serial)}')" title="Kopyala" style="color: var(--primary);">
              <i data-lucide="copy" style="width: 16px;"></i>
            </button>
            <button class="mini-delete" onclick="deleteRecord(${index})" title="Sil">
              <i data-lucide="trash-2" style="width: 16px;"></i>
            </button>
          </td>
        `;
        recordsTableBody.appendChild(tr);
      });
      recordCountEl.textContent = `${records.length} Kayıt`;
      lucide.createIcons();
    }

    function saveRecords() {
      localStorage.setItem('serial_records_premium_v1', JSON.stringify(records));
    }

    function addRecord(customSerial = null) {
      const serial = (customSerial || resultBox.value).trim().toUpperCase();
      if (!serial || serial === 'TARAMA BEKLENIYOR...') {
        if (!customSerial) setStatus('Kaydedilecek veri bulunamadı.');
        return;
      }
      if (records.includes(serial)) {
        if (!customSerial) setStatus('Bu seri no zaten listede.');
        return;
      }
      records.unshift(serial);
      saveRecords();
      renderTable();
      setStatus(customSerial ? 'Otomatik eklendi: ' + serial : 'Listeye eklendi.');
    }

    function copyRecord(text) {
      navigator.clipboard.writeText(text).then(() => {
        setStatus('Kopyalandı: ' + text);
      });
    }

    function deleteRecord(index) {
      records.splice(index, 1);
      saveRecords();
      renderTable();
      setStatus('Kayıt silindi.');
    }

    function clearRecords() {
      if (!confirm('Tüm kayıtları silmek istediğinize emin misiniz?')) return;
      records = [];
      saveRecords();
      renderTable();
      setStatus('Tüm veriler temizlendi.');
    }

    function exportXls() {
      if (!records.length) {
        setStatus('Aktarılacak veri yok.');
        return;
      }

      const tableHtml = `
        <table border="1">
          <tr><th style="background-color: #10b981; color: white;">Seri Numarası</th></tr>
          ${records.map(s => `<tr><td>${escapeHtml(s)}</td></tr>`).join('')}
        </table>
      `;
      const html = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office"
              xmlns:x="urn:schemas-microsoft-com:office:excel"
              xmlns="http://www.w3.org/TR/REC-html40">
        <head><meta charset="UTF-8"></head>
        <body>${tableHtml}</body></html>
      `;
      const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'seri-numaralari.xls';
      a.click();
      URL.revokeObjectURL(url);
      setStatus('Excel dosyası indirildi.');
    }

    function copyAll() {
      if (!records.length) {
        setStatus('Kopyalanacak kayıt yok.');
        return;
      }
      const text = records.join('\n');
      navigator.clipboard.writeText(text).then(() => {
        setStatus('Tüm kayıtlar kopyalandı.');
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    window.deleteRecord = deleteRecord;

    document.getElementById('saveBtn').addEventListener('click', () => addRecord());
    document.getElementById('exportBtn').addEventListener('click', exportXls);
    document.getElementById('clearBtn').addEventListener('click', clearRecords);
    document.getElementById('restartBtn').addEventListener('click', startCamera);
    document.getElementById('copyAllBtn').addEventListener('click', copyAll);

    // Initial render
    renderTable();
    setTimeout(startCamera, 300);

    // Pulse animation keyframes injected via JS
    const style = document.createElement('style');
    style.textContent = `
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); color: #fff; }
        100% { transform: scale(1); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
